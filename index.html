<script>
/* 尽早定主题：优先 localStorage，其次系统；避免首屏白闪 */
(function () {
  try {
    var saved = localStorage.getItem('theme');
    var isDark = saved === 'dark' ||
      (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>

/* 描边按钮 */

/* ========== 提示气泡 ========== */

<script>
/* ========== 复制文本：优先 Clipboard API，回退 execCommand ========== */
function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text).then(
      function () { return true; },
      function () { return fallbackCopy(text); }
    );
  }
  return Promise.resolve(fallbackCopy(text));
}

/* 回退方案（非安全上下文或旧浏览器） */
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '-1000px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, ta.value.length); // iOS 需要
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

/* ========== 主复制入口（供 onclick 调用） ========== */
function cp(txt, sel) {
  var el = document.getElementById(sel);
  copyText(txt).then(function (ok) {
    setTips(sel, ok ? '已复制' : '复制失败');

    if (ok && el && el.tagName === 'BUTTON') {
      var label = el.textContent;
      el.textContent = '已复制';
      el.disabled = true;
      setTimeout(function () {
        el.textContent = label;
        el.disabled = false;
      }, 1200);
    }
  });
}

/* ========== 提示气泡 ========== */
var currentTip = null;

function setTips(id, title) {
  if (currentTip && currentTip.parentNode) {
    currentTip.parentNode.removeChild(currentTip);
  }

  var el = document.getElementById(id);
  if (!el) return;

  var tip = document.createElement('div');
  tip.className = 'tip';
  tip.textContent = title;
  document.body.appendChild(tip);
  currentTip = tip;

  var rect = el.getBoundingClientRect();
  var tipRect = tip.getBoundingClientRect();
  var left = rect.left + window.scrollX + (rect.width - tipRect.width) / 2;
  var top = rect.top + window.scrollY - tipRect.height - 10;

  var minLeft = window.scrollX + 8;
  var maxLeft = window.scrollX + window.innerWidth - tipRect.width - 8;
  if (left < minLeft) left = minLeft;
  if (left > maxLeft) left = maxLeft;

  if (top < window.scrollY + 8) {
    top = rect.bottom + window.scrollY + 10;
  }

  tip.style.left = left + 'px';
  tip.style.top = top + 'px';

  setTimeout(function () {
    if (tip.parentNode) tip.parentNode.removeChild(tip);
    if (currentTip === tip) currentTip = null;
  }, 1500);
}

/* ========== 工具函数（保留外部可能调用的钩子） ========== */
function op(url) { window.open(url); }
function dl(url) { window.open("https://tv.221220.xyz/dl/?" + Date.now() + url); }

/* ========== 主题切换 ========== */
(function () {
  var root = document.documentElement;
  var btn = document.getElementById('themeToggle');

  function isDark() {
    return root.getAttribute('data-theme') === 'dark';
  }
  function sync() {
    btn.textContent = isDark() ? '☀️' : '🌙';
    btn.title = isDark() ? '切换为亮色' : '切换为暗色';
  }

  btn.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    sync();
  });

  // 用户没手动选过时，跟随系统主题实时变化
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var onChange = function (e) {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (err) {}
    if (saved !== 'dark' && saved !== 'light') {
      root.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      sync();
    }
  };
  if (mq.addEventListener) mq.addEventListener('change', onChange);
  else if (mq.addListener) mq.addListener(onChange);

  sync();
})();
</script>
